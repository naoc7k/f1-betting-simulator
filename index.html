<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🏎️%3C/text%3E%3C/svg%3E">
  <title>F1 BETTING SIMULATOR</title>
  <link rel="stylesheet" href="css/style.css?v=5.6">
  <!-- Three.js 3D WebGL Engine & PeerJS WebRTC Multiplayer -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    (function () {
      try {
        sessionStorage.removeItem('f1bs_admin_token_v2');
        localStorage.removeItem('f1bs_admin_token_v2');
        if (location.protocol !== 'file:') {
          fetch('index.html?_cb=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.text(); })
            .then(function (html) {
              var m = html && html.match(/js\/app\.js\?v=([0-9.]+)/);
              if (m && m[1] && m[1] !== '5.6') {
                var u = new URL(location.href);
                u.searchParams.set('_v', m[1]);
                location.replace(u.toString());
              }
            }).catch(function () {});
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="js/tracks.js?v=5.6"></script>
  <script src="js/finance.js?v=5.6"></script>
  <script src="js/multiplayer.js?v=5.6"></script>
  <script src="js/sim3d.js?v=5.6"></script>
  <script src="js/app.js?v=5.6"></script>
</body>
</html>
